title: LSASS Memory Access by Suspicious Process
id: 5ef4a8ab-b788-4b3e-990e-b88a72cd82b1
status: stable
description: Detects processes accessing LSASS memory with read permissions commonly
    used by credential dumping tools such as Mimikatz, ProcDump, and Task Manager dumps.
references:
    - https://attack.mitre.org/techniques/T1003/001/
    - https://docs.microsoft.com/en-us/windows/win32/procthread/process-security-and-access-rights
author: Detection KB
date: 2024-01-15
modified: 2024-06-01
tags:
    - attack.credential_access
    - attack.t1003.001
logsource:
    category: process_access
    product: windows
detection:
    selection:
        TargetImage|endswith: '\lsass.exe'
        GrantedAccess|contains:
            - '0x1010'
            - '0x1410'
            - '0x143a'
            - '0x1438'
            - '0x40'
            - '0x1000'
    filter_legitimate:
        SourceImage|startswith:
            - 'C:\Windows\System32\'
            - 'C:\Windows\SysWOW64\'
            - 'C:\Program Files\Windows Defender\'
        SourceImage|endswith:
            - '\MsMpEng.exe'
            - '\SenseIR.exe'
            - '\taskmgr.exe'
    condition: selection and not filter_legitimate
falsepositives:
    - Security products performing memory scanning
    - Legitimate administrative tools
level: high
