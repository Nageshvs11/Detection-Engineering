title: Kerberoasting - RC4 Encrypted Kerberos TGS Request
id: 2f3e5e2a-6f3c-4b1e-9c8a-5d9b4f2e7c1a
status: stable
description: Detects Kerberoasting activity by identifying Kerberos service ticket
    requests (TGS-REQ) using RC4 encryption (0x17), which is requested by tools such
    as Rubeus and Impacket GetUserSPNs against accounts with SPNs set.
references:
    - https://attack.mitre.org/techniques/T1558/003/
    - https://adsecurity.org/?p=3458
author: Detection KB
date: 2024-01-20
modified: 2024-06-01
tags:
    - attack.credential_access
    - attack.t1558.003
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4769
        TicketOptions: '0x40810000'
        TicketEncryptionType: '0x17'
    filter_computer_accounts:
        ServiceName|endswith: '$'
    filter_common_services:
        ServiceName:
            - 'krbtgt'
            - 'kadmin'
    condition: selection and not filter_computer_accounts and not filter_common_services
falsepositives:
    - Legacy applications that only support RC4 encryption
    - Older Kerberos clients that do not negotiate AES
level: high
