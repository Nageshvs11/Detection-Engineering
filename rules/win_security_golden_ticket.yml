title: Kerberos Golden Ticket - Forged TGT Indicators
id: b0a3c1e7-2d4f-4a9b-8c5e-6f1d3e7a9b2c
status: test
description: Detects use of forged Kerberos TGTs (Golden Tickets) by identifying
    anomalous TGS requests where the ticket lifetime exceeds the domain maximum (typically
    10 hours) or uses a non-standard encryption type, as generated by Mimikatz kerberos::golden.
references:
    - https://attack.mitre.org/techniques/T1558/001/
    - https://adsecurity.org/?p=1515
author: Detection KB
date: 2024-02-10
modified: 2024-06-01
tags:
    - attack.credential_access
    - attack.t1558.001
    - attack.persistence
    - attack.t1098
logsource:
    product: windows
    service: security
detection:
    selection_rc4_tgt:
        EventID: 4768
        TicketEncryptionType: '0x17'
        Status: '0x0'
    selection_anomalous_options:
        EventID: 4769
        TicketOptions: '0x40800010'
    filter_expected_clients:
        IpAddress: '::1'
    condition: (selection_rc4_tgt or selection_anomalous_options) and not filter_expected_clients
falsepositives:
    - Domain controllers running older OS versions without AES Kerberos support
    - Non-Windows Kerberos implementations (MIT Kerberos, Heimdal)
level: high
