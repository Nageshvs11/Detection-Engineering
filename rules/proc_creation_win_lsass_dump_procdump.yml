title: LSASS Dump via ProcDump or Comsvcs
id: a3a83a0a-d5d6-4f36-8ac8-3e4b2ba18b3c
status: stable
description: Detects attempts to dump LSASS memory using ProcDump with the -ma flag
    or via comsvcs.dll MiniDump export, both common living-off-the-land techniques.
references:
    - https://attack.mitre.org/techniques/T1003/001/
    - https://lolbas-project.github.io/lolbas/Libraries/Comsvcs/
author: Detection KB
date: 2024-01-15
modified: 2024-06-01
tags:
    - attack.credential_access
    - attack.t1003.001
    - attack.defense_evasion
    - attack.t1218
logsource:
    category: process_creation
    product: windows
detection:
    selection_procdump:
        Image|endswith:
            - '\procdump.exe'
            - '\procdump64.exe'
        CommandLine|contains|all:
            - 'lsass'
            - '-ma'
    selection_comsvcs:
        CommandLine|contains|all:
            - 'comsvcs'
            - 'MiniDump'
            - 'lsass'
    condition: selection_procdump or selection_comsvcs
falsepositives:
    - Authorized memory analysis during incident response (should be documented)
level: critical
