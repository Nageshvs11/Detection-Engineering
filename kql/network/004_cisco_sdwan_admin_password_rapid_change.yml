title: Cisco SD-WAN Manager Admin Account Rapid Password Change and Revert
id: 3fe091b4-a437-4c02-b793-62ff5552a564
status: experimental
description: |
    Detects two or more password changes on the SD-WAN Manager `admin` account within a 20-minute
    window. In the documented campaign, the threat actor changed the admin password to gain web
    interface access, then immediately reverted it to avoid alerting administrators.

    Signal tier: T3 — behavioral pattern (rapid change+revert). Single change is legitimate;
    two changes within 20 minutes on the admin account is the suspicious anchor.

author: purple-team
date: 2026-06-27
modified: 2026-06-27

tags:
    - attack.defense_evasion
    - attack.t1098
    - attack.credential_access

logsource:
    product: linux
    service: auth
    category: account_management

detection:
    selection:
        ProcessName: usermod
        SyslogMessage|contains|all:
            - change user
            - admin
            - password
    condition: selection | count >= 2

# ── Sentinel metadata ─────────────────────────────────────────────────────────
platform: sentinel
rule_type: HuntingQuery
use_case_id: Network-DET-Cisco-004_cisco_sdwan_admin_password_rapid_change
lookback: 20m

prerequisites:
    - Cisco Catalyst SD-WAN Manager syslog (/var/log/auth.log) forwarded to Sentinel
    - Syslog table receiving vManage auth.log events (ProcessName = "usermod")

watchlists:
    - High-Value-Assets

falsepositives:
    - Legitimate rapid password rotation by two concurrent administrators
    - Automated credential rotation scripts — document and exclude by computer name if applicable

# medium: change+revert pattern is suspicious but could be legitimate admin workflow;
# promote to AnalyticRule after FP baseline validation over 2 weeks in production
level: medium

tests:
    - name: Two admin password changes within 5 minutes
      event:
          ProcessName: usermod
          SyslogMessage: "change user 'admin' password"
          HostName: vManage
      expected: match

kql_query: |
    // Use case ID: Network-DET-Cisco-004_cisco_sdwan_admin_password_rapid_change
    // ATT&CK:      T1098 — Account Manipulation
    // Severity:    medium (promote to high after FP validation)
    // Target:      Sentinel (Syslog table)
    // Type:        HuntingQuery — promote to AnalyticRule after 2-week FP baseline
    //
    // ── Watchlist ─────────────────────────────────────────────────────────────
    let HighValueAssets = toscalar(
        _GetWatchlist('High-Value-Assets') | summarize make_set(tolower(SearchKey)));
    //
    // ── Base query ────────────────────────────────────────────────────────────
    Syslog
    | where TimeGenerated > ago(20m)
    | where ProcessName == "usermod"
    | where SyslogMessage contains "change user"
          and SyslogMessage contains "admin"
          and SyslogMessage contains "password"
    //
    // ── Count changes per device within the window ────────────────────────────
    | summarize
        FirstChange = min(TimeGenerated),
        LastChange  = max(TimeGenerated),
        ChangeCount = count(),
        arg_max(TimeGenerated, *)
        by HostName
    //
    // ── Threshold: 2+ changes in 20 min = suspicious ─────────────────────────
    | where ChangeCount >= 2
    //
    // ── Compute time span ─────────────────────────────────────────────────────
    | extend TimeSpanMinutes = datetime_diff('minute', LastChange, FirstChange)
    //
    // ── Severity graduation ───────────────────────────────────────────────────
    | extend IsCriticalAsset = tolower(HostName) in (HighValueAssets)
    | extend Severity = case(IsCriticalAsset, "High", "Medium")
    //
    // ── Rule metadata ─────────────────────────────────────────────────────────
    | extend
        ATT_CK = "T1098",
        RuleID = "Network-DET-Cisco-004_cisco_sdwan_admin_password_rapid_change",
        Triage = strcat(
            "1. Verify whether change was authorized (check change ticket / maintenance window). ",
            "2. Review /var/confd/rollback/ for config delta commits to admin password. ",
            "3. Correlate with SSH auth events from external IPs in the same time window. ",
            "4. Check SD-WAN Manager web access logs for auth events between the two changes. ",
            "5. If no authorized change ticket: treat as active intrusion.")
    //
    // ── Output ────────────────────────────────────────────────────────────────
    | project
        Severity, HostName, Computer,
        ChangeCount, TimeSpanMinutes,
        FirstChange, LastChange,
        IsCriticalAsset, ATT_CK, RuleID, Triage
    | sort by Severity asc, LastChange desc
