title: Passwordless Sudo Probing / Non-Interactive Root Shell (Linux LPE)
id: 0f81f6f5-6665-462d-ba64-895ee98b097f
status: experimental
description: |
  Detects non-interactive 'sudo -n' used to test for or invoke a passwordless sudo rule
  (e.g. 'sudo -n true', 'sudo -n -l', 'sudo -n bash'). Directly follows the sudoers write in
  the OVSwrap (CVE-2026-64531) chain and is a common post-exploit validation step.
  Detection logic adapted from Elastic Security Labs - Linux LPE detection framework.
author: Nagesh Venkataraman
date: 2026/09/28
modified: 2026/09/28
tags:
  - attack.privilege_escalation
  - attack.t1548.003
logsource:
  product: linux
  service: mde_device_events
detection:
  selection:
    DeviceName: '*'
  condition: selection
platform: both
rule_type: AnalyticRule
use_case_id: OS-DET-LNX-002_passwordless_sudo_probing
schedule: PT1H
lookback: PT1H
suppress: PT1H
prerequisites:
  - Linux endpoints onboarded to Microsoft Defender for Endpoint (Plan 2)
  - MDE DeviceProcessEvents / DeviceInfo available in Defender XDR advanced hunting, or ingested into Sentinel via the Microsoft Defender XDR connector
watchlists:
  - High-Value-Assets
falsepositives:
  - Automation/CI that legitimately probes sudo rights with 'sudo -n -l' - baseline the initiating account
  - Monitoring agents that check privilege state non-interactively
level: medium
kql_query: |
  let lookback = 1h;
  DeviceProcessEvents
  | where Timestamp > ago(lookback)
  | where FileName == "sudo"
  | where ProcessCommandLine matches regex @"\bsudo\b.*\s-n\b"
  | where ProcessCommandLine has_any ("-n true","-n -l","-n bash","-n sh","-n -s",
      "-n /bin/","-n /usr/bin/","-n dash","-n zsh")
  | where AccountName != "root"
  | project Timestamp, DeviceName, DeviceId, AccountName, ProcessCommandLine,
            InitiatingProcessAccountName, InitiatingProcessFileName,
            InitiatingProcessCommandLine, InitiatingProcessFolderPath, ReportId
  | sort by Timestamp desc
references:
  - https://www.elastic.co/security-labs/threat-command/linux-privilege-escalation-detection-framework
  - https://github.com/elastic/detection-rules
  - https://github.com/elastic/protections-artifacts
