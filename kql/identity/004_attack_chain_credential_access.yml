title: Credential Access Attack Chain — Multi-Signal Correlation
id: d4e5f6a7-b8c9-0123-def0-123456789012
status: stable
description: |
    Correlates three independent credential-access signals against the same account
    within a 24-hour window to surface coordinated attack chains that individual
    rules would report as separate, lower-priority incidents.

    Signal A — Password Spray (T1110.003): account received spray-pattern
    authentication failures (3+ failures from a non-excluded IP).

    Signal B — MFA Fatigue (T1621): account accumulated 3+ MFA denials or
    timeouts — push-bombing pattern.

    Signal C — Impossible Travel (T1078.004): account signed in successfully
    from two geographically distant countries within a 2-hour window.

    Alert fires when the same UPN appears in 2 or more distinct signals.
    An account targeted by all three simultaneously has a near-zero false
    positive rate and represents an active, coordinated campaign.
author: Detection KB
date: 2026-05-28
modified: 2026-05-28

tags:
    - attack.credential_access
    - attack.t1110.003
    - attack.t1621
    - attack.t1078.004

logsource:
    product: azure
    service: azure_ad_sign_in_logs

detection:
    selection:
        ResultType:
            - 0
            - 50126
            - 50055
            - 50056
            - 50053
    condition: selection

platform: sentinel
rule_type: AnalyticRule
use_case_id: Identity-DET-Azure-004_attack_chain_credential_access
schedule: 15m
lookback: 24h
suppress: UserPrincipalName:6h

prerequisites:
    - Microsoft Entra ID data connector; SigninLogs, AADNonInteractiveUserSignInLogs,
      ADFSSignInLogs, and IdentityInfo tables populated

watchlists:
    - VPN-Egress-IPs
    - Vuln-Scanner-IPs
    - BAS-IPs
    - Service-Accounts
    - Sanctioned-Apps
    - High-Value-Assets

falsepositives:
    - All three constituent rules apply their own exclusions before contributing a
      signal; the residual FP rate for 2+ correlated signals is very low
    - An account appearing in spray + impossible travel with no MFA signal may
      indicate a shared egress IP not yet in the VPN watchlist — verify before escalating
    - Global traveling executives occasionally trigger both spray (failed logins from
      hotel WiFi sharing an IP with other guests) and impossible travel — correlate
      with travel calendar

# Two correlated signals = coordinated attack; three = near-certain campaign
level: high

kql_query: |
    let LookbackPeriod      = 24h;
    let SprayFailureCodes   = dynamic([50126, 50055, 50056, 50053]);
    let MfaFailureCodes     = dynamic(["500121", "50076", "50158", "50074"]);
    let TravelWindow        = 2h;    // impossible-travel window for correlation rule (wider than individual rule)

    // ── Shared watchlist exclusions ───────────────────────────────────────────────
    let ExcludedVPNIPs = toscalar(
        _GetWatchlist('VPN-Egress-IPs') | summarize make_set(SearchKey));
    let ExcludedScannerIPs = toscalar(
        _GetWatchlist('Vuln-Scanner-IPs') | summarize make_set(SearchKey));
    let ExcludedBASIPs = toscalar(
        _GetWatchlist('BAS-IPs') | summarize make_set(SearchKey));
    let ExcludedServiceAccounts = toscalar(
        _GetWatchlist('Service-Accounts') | summarize make_set(tolower(SearchKey)));
    let SanctionedApps = toscalar(
        _GetWatchlist('Sanctioned-Apps') | summarize make_set(tolower(SearchKey)));
    let HighValueAssets = toscalar(
        _GetWatchlist('High-Value-Assets') | summarize make_set(tolower(SearchKey)));

    // ── Signal A: Password spray target ──────────────────────────────────────────
    // Re-derives the spray signal: account received 3+ spray-pattern failures from
    // a non-excluded source IP.  Mirrors the logic in 003_password_spray.yml.
    let SignalSpray = materialize(
        union SigninLogs, AADNonInteractiveUserSignInLogs
        | where TimeGenerated > ago(LookbackPeriod)
        | where ResultType in (SprayFailureCodes)
        | where isnotempty(IPAddress) and isnotempty(UserPrincipalName)
        | where tolower(UserPrincipalName) !in (ExcludedServiceAccounts)
        | where UserPrincipalName !endswith "#EXT#@"
        | where IPAddress !in (ExcludedVPNIPs)
        | where IPAddress !in (ExcludedScannerIPs)
        | where IPAddress !in (ExcludedBASIPs)
        | where tolower(AppDisplayName) !in (SanctionedApps)
        | summarize
            FailCount   = count(),
            SourceIPs   = make_set(IPAddress, 10),
            FirstSeen   = min(TimeGenerated),
            LastSeen    = max(TimeGenerated)
            by UserPrincipalName
        | where FailCount >= 3
        | extend
            SignalType   = "PasswordSpray",
            ATT_CK       = "T1110.003",
            SignalDetail = strcat(
                FailCount, " failed auth attempts. Source IPs: ", tostring(SourceIPs)
            )
        | project UserPrincipalName, SignalType, ATT_CK, FirstSeen, LastSeen, SignalDetail
    );

    // ── Signal B: MFA fatigue ─────────────────────────────────────────────────────
    // Re-derives the MFA fatigue signal: account accumulated 3+ denials/timeouts.
    // Mirrors the denial-detection logic in 002_mfa_fatigue_adfs_push_bombing.yml.
    let SignalMFA = materialize(
        ADFSSignInLogs
        | where TimeGenerated > ago(LookbackPeriod)
        | where AuthenticationRequirement == "multiFactorAuthentication"
        | where isnotempty(UserPrincipalName)
        | where tolower(UserPrincipalName) !in (ExcludedServiceAccounts)
        | where UserPrincipalName !endswith "#EXT#@"
        | extend
            SourceIP      = coalesce(IPAddress, ""),
            MfaAuthDetail = tostring(MfaDetail.authDetail)
        | where SourceIP !in (ExcludedVPNIPs)
        | where SourceIP !in (ExcludedScannerIPs)
        | where SourceIP !in (ExcludedBASIPs)
        | where tolower(AppDisplayName) !in (SanctionedApps)
        | where MfaAuthDetail has_any ("declined", "denied", "timed out", "didn't respond", "no response")
               or ResultType in (MfaFailureCodes)
        | summarize
            DenialCount = count(),
            SourceIPs   = make_set(SourceIP, 10),
            MfaMethods  = make_set(tostring(MfaDetail.authMethod), 5),
            FirstSeen   = min(TimeGenerated),
            LastSeen    = max(TimeGenerated)
            by UserPrincipalName
        | where DenialCount >= 3
        | extend
            SignalType   = "MFAFatigue",
            ATT_CK       = "T1621",
            SignalDetail = strcat(
                DenialCount, " MFA denials/timeouts. Methods: ", tostring(MfaMethods),
                ". Source IPs: ", tostring(SourceIPs)
            )
        | project UserPrincipalName, SignalType, ATT_CK, FirstSeen, LastSeen, SignalDetail
    );

    // ── Signal C: Impossible travel ───────────────────────────────────────────────
    // Re-derives the impossible travel signal: 2 successful sign-ins from different
    // countries within TravelWindow.  Mirrors 001_impossible_travel_login.yml.
    let SignInBase = materialize(
        SigninLogs
        | where TimeGenerated > ago(LookbackPeriod)
        | where ResultType == 0
        | where isnotempty(LocationDetails)
        | extend
            Country = tostring(LocationDetails.countryOrRegion),
            City    = tostring(LocationDetails.city)
        | where isnotempty(Country) and Country != "Unknown"
        | where tolower(UserPrincipalName) !in (ExcludedServiceAccounts)
        | where UserPrincipalName !endswith "#EXT#@"
        | where UserType != "Guest"
        | where IPAddress !in (ExcludedVPNIPs)
        | where tolower(AppDisplayName) !in (SanctionedApps)
        | project TimeGenerated, UserPrincipalName, IPAddress, Country, City, AppDisplayName
    );

    let SignalTravel = materialize(
        SignInBase
        | join kind=inner (
            SignInBase
            | project
                TimeGenerated2 = TimeGenerated,
                UserPrincipalName,
                Country2       = Country,
                City2          = City,
                IP2            = IPAddress
        ) on UserPrincipalName
        | where Country != Country2
        | where TimeGenerated < TimeGenerated2
        | where (TimeGenerated2 - TimeGenerated) <= TravelWindow
        | summarize
            TravelRoutes = make_set(strcat(Country, " (", City, ") → ", Country2, " (", City2, ")"), 5),
            PairCount    = count(),
            FirstSeen    = min(TimeGenerated),
            LastSeen     = max(TimeGenerated2)
            by UserPrincipalName
        | extend
            SignalType   = "ImpossibleTravel",
            ATT_CK       = "T1078.004",
            SignalDetail = strcat(
                PairCount, " impossible-travel pair(s). Routes: ", tostring(TravelRoutes)
            )
        | project UserPrincipalName, SignalType, ATT_CK, FirstSeen, LastSeen, SignalDetail
    );

    // ── Correlate: accounts in 2+ distinct signals ────────────────────────────────
    SignalSpray
    | union SignalMFA
    | union SignalTravel
    | summarize
        SignalCount    = dcount(SignalType),
        SignalTypes    = make_set(SignalType),
        ATT_CK_Codes   = make_set(ATT_CK),
        EarliestSignal = min(FirstSeen),
        LatestSignal   = max(LastSeen),
        // bag maps SignalType → detail string for analyst readability
        SignalDetails  = make_bag(pack(SignalType, SignalDetail))
        by UserPrincipalName
    | where SignalCount >= 2
    // ── Enrich: IdentityInfo ──────────────────────────────────────────────────────
    | join kind=leftouter (
        IdentityInfo
        | where TimeGenerated > ago(7d)
        | summarize arg_max(TimeGenerated, *) by AccountUPN
        | project
            AccountUPN,
            DisplayName      = AccountDisplayName,
            JobTitle,
            Department,
            IsMFARegistered,
            AssignedRoles,
            IsAccountEnabled
    ) on $left.UserPrincipalName == $right.AccountUPN
    // ── Severity graduation ───────────────────────────────────────────────────────
    | extend
        IsCriticalAsset = tolower(UserPrincipalName) in (HighValueAssets),
        IsPrivilegedAccount = AssignedRoles has_any (
            "Global Administrator", "Privileged Role Administrator",
            "Security Administrator", "Exchange Administrator",
            "SharePoint Administrator", "Conditional Access Administrator"
        )
    | extend Severity = case(
        // Three signals firing simultaneously = near-certain coordinated campaign
        SignalCount >= 3,                                  "Critical",
        // Two signals + privileged/critical account = immediate escalation
        IsCriticalAsset or IsPrivilegedAccount,            "Critical",
        // Two signals against a standard user = high priority
        "High"
    )
    // ── Rule metadata ─────────────────────────────────────────────────────────────
    | extend
        ATT_CK  = tostring(ATT_CK_Codes),
        RuleID  = "Identity-DET-Azure-004_attack_chain_credential_access",
        Triage  = strcat(
            "MULTI-SIGNAL CORRELATED ALERT — ", SignalCount, " attack technique(s) ",
            "against ", UserPrincipalName, ". Active signals: ", tostring(SignalTypes), ". ",
            "Timeline: ", tostring(EarliestSignal), " → ", tostring(LatestSignal), ". ",
            "ACTION: ",
            iff(SignalTypes has "MFAFatigue" or SignalTypes has "ImpossibleTravel",
                "Treat as active account compromise — revoke all sessions NOW "
                "(Entra ID → Users → Revoke sessions) and force password + MFA reset. ",
                "Escalate for investigation — spray signals present but no confirmed access yet. "
            ),
            "Per-signal details: ", tostring(SignalDetails), ". ",
            "Check AADNonInteractiveUserSignInLogs and AuditLogs for token issuance ",
            "or resource access in the window above. ",
            iff(IsPrivilegedAccount, "PRIVILEGED ACCOUNT — escalate to IR immediately. ", ""),
            iff(IsCriticalAsset, "CRITICAL ASSET — escalate to IR immediately. ", "")
        ),
        AccountName   = tostring(split(UserPrincipalName, "@")[0]),
        AccountDomain = tostring(split(UserPrincipalName, "@")[1])
    // ── Output ────────────────────────────────────────────────────────────────────
    | project-reorder
        Severity,
        UserPrincipalName,
        AccountName,
        AccountDomain,
        DisplayName,
        SignalCount,
        SignalTypes,
        SignalDetails,
        EarliestSignal,
        LatestSignal,
        IsPrivilegedAccount,
        IsCriticalAsset,
        IsAccountEnabled,
        IsMFARegistered,
        JobTitle,
        Department,
        AssignedRoles,
        ATT_CK,
        RuleID,
        Triage
    | sort by Severity asc, SignalCount desc

tests:
    - name: Three-signal attack chain — Critical (all signals fire)
      log_source:
          product: azure
          service: azure_ad_sign_in_logs
      event:
          UserPrincipalName: alice@contoso.com
          # Signal A: 5 spray failures from 198.51.100.42
          # Signal B: 4 MFA denials via ADFSSignInLogs
          # Signal C: sign-in from UK then US within 90 minutes
          SignalCount: 3
      expected: match

    - name: Two-signal chain (spray + impossible travel) — High
      log_source:
          product: azure
          service: azure_ad_sign_in_logs
      event:
          UserPrincipalName: bob@contoso.com
          # Signal A: 4 spray failures
          # Signal C: impossible travel pair (UAE → USA, 45 min)
          SignalCount: 2
      expected: match

    - name: Two-signal chain against privileged account — Critical escalation
      log_source:
          product: azure
          service: azure_ad_sign_in_logs
      event:
          UserPrincipalName: admin@contoso.com
          AssignedRoles: Global Administrator
          SignalCount: 2
      expected: match

    - name: Single signal only — should NOT fire (below correlation threshold)
      log_source:
          product: azure
          service: azure_ad_sign_in_logs
      event:
          UserPrincipalName: carol@contoso.com
          SignalCount: 1
          # Only spray failures, no MFA fatigue, no impossible travel
      expected: no_match

    - name: Sanctioned app generating spray-like pattern — should NOT fire
      log_source:
          product: azure
          service: azure_ad_sign_in_logs
      event:
          UserPrincipalName: carol@contoso.com
          AppDisplayName: veeam-backup-agent   # in Sanctioned-Apps watchlist
          # App authenticating across 20 accounts produces spray-like signal
          # but is filtered by SanctionedApps exclusion in Signal A
      expected: no_match
