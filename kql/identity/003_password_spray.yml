title: Password Spray — Distributed Low-Volume Authentication Failure
id: c3d4e5f6-a7b8-9012-cdef-012345678901
status: stable
description: |
    Detects password spray attacks against Azure AD / Entra ID accounts.
    Branch A (SprayAttempt): one source IP authenticating against many distinct
    accounts with few failures per account — the hallmark of a spray designed to
    stay below per-account lockout thresholds.
    Branch B (SpraySuccess): an account that accumulated spray-pattern failures
    then produces a successful interactive sign-in — indicating account compromise
    following a spray campaign.
    Covers both interactive sign-ins (SigninLogs) and non-interactive flows
    (AADNonInteractiveUserSignInLogs) used by legacy auth clients and apps.
author: Detection KB
date: 2026-05-28
modified: 2026-05-28

tags:
    - attack.credential_access
    - attack.t1110.003

logsource:
    product: azure
    service: azure_ad_sign_in_logs

detection:
    selection:
        ResultType:
            - 50126   # InvalidUsernameOrPassword — password wrong
            - 50055   # Expired password
            - 50056   # Password does not exist for this user
            - 50053   # Account is locked
    condition: selection

platform: sentinel
rule_type: AnalyticRule
use_case_id: Identity-DET-Azure-003_password_spray
schedule: 10m
lookback: 1h
suppress: IPAddress:2h

prerequisites:
    - Microsoft Entra ID data connector; SigninLogs and AADNonInteractiveUserSignInLogs tables present

watchlists:
    - VPN-Egress-IPs
    - Vuln-Scanner-IPs
    - BAS-IPs
    - Service-Accounts
    - Sanctioned-Apps
    - High-Value-Assets

falsepositives:
    - Vulnerability scanners probing authentication endpoints — excluded via Vuln-Scanner-IPs watchlist
    - BAS platforms executing spray simulations — excluded via BAS-IPs watchlist
    - Corporate VPN egress IPs hosting many users — excluded via VPN-Egress-IPs watchlist; shared NAT from large offices can appear spray-like
    - User typo storms (wrong domain suffix causing mass 50126) — threshold of DistinctAccounts >= 10 and low AttemptsPerAccount reduce this; monitor for tuning
    - Misconfigured app using wrong credential set across multiple accounts — correlate with AppDisplayName and open a service-account review if a single app is the actor

# Spray pattern is a high-confidence pre-compromise indicator; SpraySuccess branch confirms compromise
level: high

kql_query: |
    // ── Watchlist exclusions ──────────────────────────────────────────────────────
    let ExcludedVPNIPs = toscalar(
        _GetWatchlist('VPN-Egress-IPs')
        | summarize make_set(SearchKey));
    let ExcludedScannerIPs = toscalar(
        _GetWatchlist('Vuln-Scanner-IPs')
        | summarize make_set(SearchKey));
    let ExcludedBASIPs = toscalar(
        _GetWatchlist('BAS-IPs')
        | summarize make_set(SearchKey));
    let ExcludedServiceAccounts = toscalar(
        _GetWatchlist('Service-Accounts')
        | summarize make_set(tolower(SearchKey)));
    let SanctionedApps = toscalar(
        _GetWatchlist('Sanctioned-Apps')
        | summarize make_set(tolower(SearchKey)));
    let HighValueAssets = toscalar(
        _GetWatchlist('High-Value-Assets')
        | summarize make_set(tolower(SearchKey)));

    // ── Spray detection thresholds ────────────────────────────────────────────────
    // MinDistinctAccounts: how many different accounts must be targeted from one IP
    // to be considered a spray (not a single-account brute force).
    // MaxAttemptsPerAccount: spray stays below lockout — attackers try ≤ 3 passwords
    // per account to avoid triggering Smart Lockout.
    let MinDistinctAccounts  = 10;
    let MaxAttemptsPerAccount = 3;

    // ── Failure codes that indicate a wrong password (not account-state errors) ───
    // 50126: InvalidUsernameOrPassword — core spray failure signal
    // 50055: Expired password (valid account, wrong current password)
    // 50056: No password set (valid account — useful for enumeration)
    // 50053: AccountLocked — included to catch cases where spray already tripped
    //        Smart Lockout on one account, indicating a real spray in progress
    let SprayFailureCodes = dynamic([50126, 50055, 50056, 50053]);

    // ── Base dataset: failed sign-ins across both interactive and non-interactive ──
    // Combine both tables once to normalise columns, then apply shared filters.
    let FailedSignIns =
        SigninLogs
        | where TimeGenerated > ago(1h)
        | where ResultType in (SprayFailureCodes)
        | where isnotempty(IPAddress) and isnotempty(UserPrincipalName)
        | where tolower(UserPrincipalName) !in (ExcludedServiceAccounts)
        | where UserPrincipalName !endswith "#EXT#@"     // external/guest UPNs
        | where IPAddress !in (ExcludedVPNIPs)
        | where IPAddress !in (ExcludedScannerIPs)
        | where IPAddress !in (ExcludedBASIPs)
        | where tolower(AppDisplayName) !in (SanctionedApps)
        | project
            TimeGenerated,
            UserPrincipalName,
            IPAddress,
            Location,
            AppDisplayName,
            ClientAppUsed,
            ResultType,
            ResultDescription,
            CorrelationId,
            ConditionalAccessStatus,
            AuthenticationRequirement,
            UserAgent,
            LogSource = "Interactive"
        | union (
            AADNonInteractiveUserSignInLogs
            | where TimeGenerated > ago(1h)
            | where ResultType in (SprayFailureCodes)
            | where isnotempty(IPAddress) and isnotempty(UserPrincipalName)
            | where tolower(UserPrincipalName) !in (ExcludedServiceAccounts)
            | where UserPrincipalName !endswith "#EXT#@"
            | where IPAddress !in (ExcludedVPNIPs)
            | where IPAddress !in (ExcludedScannerIPs)
            | where IPAddress !in (ExcludedBASIPs)
            | where tolower(AppDisplayName) !in (SanctionedApps)
            | project
                TimeGenerated,
                UserPrincipalName,
                IPAddress,
                Location,
                AppDisplayName,
                ClientAppUsed,
                ResultType,
                ResultDescription,
                CorrelationId,
                ConditionalAccessStatus,
                AuthenticationRequirement,
                UserAgent,
                LogSource = "NonInteractive"
        );

    // ── Branch A: SprayAttempt — one IP → many accounts, few attempts per account ─
    // This is the canonical spray pattern: the attacker distributes attempts across
    // many accounts to avoid per-account Smart Lockout thresholds.
    let SprayAttempt = FailedSignIns
    | summarize
        TotalFailures         = count(),
        DistinctAccounts      = dcount(UserPrincipalName),
        TargetedAccounts      = make_set(UserPrincipalName, 50),
        AttemptsPerAccountAvg = round(count() * 1.0 / dcount(UserPrincipalName), 1),
        DistinctApps          = dcount(AppDisplayName),
        AppsTargeted          = make_set(AppDisplayName, 10),
        DistinctLocations     = dcount(Location),
        LogSources            = make_set(LogSource, 2),
        FailureCodes          = make_set(ResultType, 5),
        UserAgents            = make_set(UserAgent, 5),
        FirstAttempt          = min(TimeGenerated),
        LastAttempt           = max(TimeGenerated)
        by IPAddress
    // --- spray pattern: many accounts, few attempts each ---
    | where DistinctAccounts >= MinDistinctAccounts
    | where AttemptsPerAccountAvg <= MaxAttemptsPerAccount
    | extend
        DetectionBranch = "SprayAttempt",
        // Escalate to Critical if any targeted account is on the High-Value-Assets watchlist
        HVATargeted = array_length(set_intersect(
            TargetedAccounts,
            HighValueAssets
        )) > 0,
        Severity = iff(
            array_length(set_intersect(TargetedAccounts, HighValueAssets)) > 0,
            "Critical",
            "High"
        ),
        AttackStatus = strcat(
            "Spray in progress — ", DistinctAccounts,
            " accounts targeted from ", IPAddress,
            "; avg ", AttemptsPerAccountAvg, " attempts/account"
        )
    | project
        DetectionBranch,
        Severity,
        AttackStatus,
        IPAddress,
        TotalFailures,
        DistinctAccounts,
        AttemptsPerAccountAvg,
        TargetedAccounts,
        DistinctApps,
        AppsTargeted,
        DistinctLocations,
        LogSources,
        FailureCodes,
        UserAgents,
        HVATargeted,
        FirstAttempt,
        LastAttempt;

    // ── Branch B: SpraySuccess — spray failures followed by successful sign-in ────
    // An account that matches the spray pattern (3+ failures from a spray-looking IP)
    // and then successfully authenticates is a confirmed compromise signal.
    // The attacker found the correct password and used it.
    let SprayedAccounts = FailedSignIns
    | summarize
        FailCount      = count(),
        SprayIPs       = make_set(IPAddress, 20),
        FirstFailure   = min(TimeGenerated),
        LastFailure    = max(TimeGenerated)
        by UserPrincipalName
    | where FailCount >= 3;   // lower bar than Branch A — success after 3 failures is suspicious

    let SpraySuccess = SprayedAccounts
    | join kind=inner (
        SigninLogs
        | where TimeGenerated > ago(1h)
        | where ResultType == 0          // success
        | where isnotempty(UserPrincipalName)
        | where tolower(UserPrincipalName) !in (ExcludedServiceAccounts)
        | project
            UserPrincipalName,
            SuccessTime     = TimeGenerated,
            SuccessIP       = IPAddress,
            SuccessApp      = AppDisplayName,
            SuccessLocation = Location,
            SuccessClient   = ClientAppUsed,
            SuccessCorrelId = CorrelationId
    ) on UserPrincipalName
    // Success must follow at least one failure in the window
    | where SuccessTime > FirstFailure
    // Enrich: was the success from a different IP than the spray IPs?
    | extend SuccessIPFromNewSource = SuccessIP !in (SprayIPs)
    | summarize arg_max(SuccessTime, *) by UserPrincipalName   // one row per user
    // Enrich with account context
    | join kind=leftouter (
        IdentityInfo
        | where TimeGenerated > ago(7d)
        | summarize arg_max(TimeGenerated, *) by AccountUPN
        | project
            AccountUPN,
            DisplayName      = AccountDisplayName,
            JobTitle,
            Department,
            Manager          = ManagerDisplayName,
            IsMFARegistered,
            AssignedRoles,
            IsAccountEnabled
    ) on $left.UserPrincipalName == $right.AccountUPN
    | extend
        DetectionBranch = "SpraySuccess",
        // Always Critical — confirmed password found and used
        Severity = "Critical",
        IsPrivilegedAccount = AssignedRoles has_any (
            "Global Administrator", "Privileged Role Administrator",
            "Security Administrator", "Exchange Administrator",
            "SharePoint Administrator", "Conditional Access Administrator"
        ),
        IsCriticalAsset = tolower(UserPrincipalName) in (HighValueAssets),
        AttackStatus = strcat(
            "COMPROMISED — spray found valid password. Successful sign-in at ",
            tostring(SuccessTime), " from ", SuccessIP,
            iff(SuccessIPFromNewSource, " (different IP from spray source)", "")
        )
    | project
        DetectionBranch,
        Severity,
        AttackStatus,
        UserPrincipalName,
        DisplayName,
        JobTitle,
        Department,
        Manager,
        IsAccountEnabled,
        IsMFARegistered,
        IsPrivilegedAccount,
        IsCriticalAsset,
        AssignedRoles,
        FailCount,
        SprayIPs,
        FirstFailure,
        LastFailure,
        SuccessTime,
        SuccessIP,
        SuccessApp,
        SuccessLocation,
        SuccessIPFromNewSource;

    // ── Union branches ────────────────────────────────────────────────────────────
    SprayAttempt
    | union SpraySuccess
    // ── Rule metadata ─────────────────────────────────────────────────────────────
    | extend
        ATT_CK = "T1110.003",
        RuleID = "Identity-DET-Azure-003_password_spray",
        Triage = case(
            DetectionBranch == "SpraySuccess",
                strcat(
                    "PRIORITY — confirmed compromise. ",
                    "1. Revoke all sessions immediately: Entra ID → Users → ",
                    UserPrincipalName, " → Revoke sessions. ",
                    "2. Force password reset and MFA re-registration. ",
                    "3. If privileged role (IsPrivilegedAccount=true): suspend account ",
                    "and escalate to Tier 2/IR. ",
                    "4. Review SuccessApp (", SuccessApp, ") for unauthorized actions ",
                    "in the session following the successful sign-in. ",
                    "5. Block spray source IPs in Conditional Access named locations."
                ),
            DetectionBranch == "SprayAttempt",
                strcat(
                    "1. Confirm source IP ", IPAddress, " is not a legitimate shared IP. ",
                    "2. Block the IP in Conditional Access named locations. ",
                    "3. Review TargetedAccounts list for accounts that may have been ",
                    "compromised silently — check for ResultType=0 from the same IP. ",
                    "4. Enable SSPR (Self-Service Password Reset) notifications so ",
                    "targeted users are alerted to failed attempts. ",
                    "5. If HVATargeted=true: treat as Priority 1 and notify account owners."
                ),
            "Review alert details."
        )
    // ── Entity fields ─────────────────────────────────────────────────────────────
    // Sentinel entity mapping:
    //   IP      → IPAddress (SprayAttempt) or SuccessIP (SpraySuccess)
    //   Account → UserPrincipalName split into AccountName + AccountDomain
    | extend
        AccountName   = iff(isnotempty(UserPrincipalName),
                            tostring(split(UserPrincipalName, "@")[0]), ""),
        AccountDomain = iff(isnotempty(UserPrincipalName),
                            tostring(split(UserPrincipalName, "@")[1]), "")
    // ── Output ────────────────────────────────────────────────────────────────────
    | project-reorder
        Severity,
        DetectionBranch,
        AttackStatus,
        UserPrincipalName,
        AccountName,
        AccountDomain,
        IPAddress,
        TotalFailures,
        DistinctAccounts,
        AttemptsPerAccountAvg,
        FailCount,
        IsPrivilegedAccount,
        IsCriticalAsset,
        ATT_CK,
        RuleID,
        Triage
    | sort by Severity asc, TotalFailures desc

    // ============================================================
    // TEST CASES — see inline tests: block below
    // ============================================================

tests:
    - name: Password spray attempt — one IP targeting 15 accounts
      log_source:
          product: azure
          service: azure_ad_sign_in_logs
      event:
          IPAddress: 198.51.100.42
          ResultType: 50126
          UserPrincipalName: user01@contoso.com
          # Simulate 15 distinct accounts with 2 failures each from same IP
          DistinctAccounts: 15
          AttemptsPerAccountAvg: 2.0
      expected: match

    - name: Spray succeeded — failures followed by successful sign-in
      log_source:
          product: azure
          service: azure_ad_sign_in_logs
      event:
          UserPrincipalName: alice@contoso.com
          ResultType: 0
          IPAddress: 198.51.100.42
          # Account had 5 prior failures (ResultType=50126) from same IP
          PriorFailureCount: 5
      expected: match

    - name: Single-account brute force — should NOT fire (DistinctAccounts=1)
      log_source:
          product: azure
          service: azure_ad_sign_in_logs
      event:
          IPAddress: 198.51.100.42
          ResultType: 50126
          UserPrincipalName: bob@contoso.com
          DistinctAccounts: 1
          TotalFailures: 50
      expected: no_match

    - name: Vulnerability scanner IP — should NOT fire (in Vuln-Scanner-IPs watchlist)
      log_source:
          product: azure
          service: azure_ad_sign_in_logs
      event:
          IPAddress: 10.0.1.200
          ResultType: 50126
          DistinctAccounts: 20
          AttemptsPerAccountAvg: 2.0
          # IPAddress is in Vuln-Scanner-IPs watchlist
      expected: no_match

    - name: VPN egress IP — should NOT fire (shared NAT, many users)
      log_source:
          product: azure
          service: azure_ad_sign_in_logs
      event:
          IPAddress: 203.0.113.1
          ResultType: 50126
          DistinctAccounts: 25
          AttemptsPerAccountAvg: 1.0
          # IPAddress is in VPN-Egress-IPs watchlist
      expected: no_match
