title: Credential Abuse in Admin Sign-Ins — Success Following Failure or Anomalous Access
id: f6a7b8c9-d0e1-2345-f012-345678901234
status: stable
description: |
  Flags successful sign-ins to sensitive admin surfaces (Azure Portal, Intune,
  Defender, Exchange Admin Center, Entra Admin Center) that show signs of
  credential abuse: a success preceded by failed attempts, or a success
  spanning multiple countries or multiple client app types within the same
  30-day window for a given user/app/IP combination.

  This is a heuristic, anomaly-style detection rather than a hard threshold
  rule — intended to surface admin sign-ins worth a closer look rather than
  to fire a high-confidence standalone alert.
author: Detection KB
date: 2026-07-18
modified: 2026-07-18

tags:
  - attack.credential_access
  - attack.t1078.004

logsource:
  product: azure
  service: azure_ad_sign_in_logs

detection:
  selection:
    AppDisplayName:
      - "Azure Portal"
      - "Microsoft Intune"
      - "Microsoft Defender"
      - "Exchange Admin Center"
      - "Microsoft Entra Admin Center"
  condition: selection

platform: sentinel
rule_type: AnalyticRule
use_case_id: Identity-DET-Azure-006_credential_abuse_admin_signins
schedule: 1d
lookback: 30d

prerequisites:
  - Microsoft Entra ID data connector; SigninLogs table populated

falsepositives:
  - Admins who travel frequently or use multiple devices may legitimately show
    multiple countries or client app types
  - Newly onboarded admins will naturally show "first-time access pattern"

level: medium

kql_query: |
  SigninLogs
  | where TimeGenerated >= ago(30d)
  | where isnotempty(UserPrincipalName)
  | where AppDisplayName in ("Azure Portal", "Microsoft Intune", "Microsoft Defender", "Exchange Admin Center", "Microsoft Entra Admin Center")
  | extend
      IsSuccess = ResultType == 0,
      IsRedirect = ResultType == 500741,
      Country = tostring(LocationDetails.countryOrRegion)
  | summarize
      FirstSeen = min(TimeGenerated),
      LastSeen = max(TimeGenerated),
      SuccessCount = countif(IsSuccess),
      FailureCount = countif(not(IsSuccess) and not(IsRedirect)),
      RedirectCount = countif(IsRedirect),
      ClientApps = make_set(ClientAppUsed, 5),
      Countries = make_set(Country, 5)
      by UserPrincipalName, AppDisplayName, IPAddress
  | where SuccessCount > 0
  | extend InvestigationReason = case(
      FailureCount > 0, "failures followed by success",
      array_length(Countries) > 1, "multiple countries observed",
      array_length(ClientApps) > 1, "multiple client types observed",
      "unusual or first-time access pattern"
      )
  | project LastSeen, UserPrincipalName, InvestigationReason, AppDisplayName, IPAddress,
      ClientApps, Countries, SuccessCount, FailureCount, RedirectCount
