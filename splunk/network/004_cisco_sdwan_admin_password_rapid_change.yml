title: Cisco SD-WAN Manager Admin Account Rapid Password Change and Revert
id: 2a885d50-cddf-4685-a92a-c519eb5602d0
status: experimental
description: |
    Detects the pattern of rapid password changes on the SD-WAN Manager `admin` account,
    specifically two or more `usermod` password-change events for `admin` within a 20-minute
    window. In the documented campaign, the threat actor changed the admin password to gain web
    interface access, then reverted it before ending the session to avoid detection by
    administrators during day-to-day operations.

    Signal tier: T3 — the behavioral pattern (change + revert within a short window) is the anchor.
    A single password change is legitimate; rapid change-then-revert is the suspicious behavior.

    Evasion: attacker could extend the time between change and revert beyond the detection window.
    A HuntingQuery companion with a 24h lookback covers this. This rule uses SavedSearch for
    the short-window pattern; promote to CorrelationSearch if FP rate is acceptable.

author: purple-team
date: 2026-06-27
modified: 2026-06-27

tags:
    - attack.defense_evasion
    - attack.t1098
    - attack.credential_access

logsource:
    product: linux
    service: auth
    category: account_management

detection:
    selection_password_change:
        process: usermod
        message|contains|all:
            - change user
            - admin
            - password
    condition: selection_password_change | count >= 2

# ── Splunk metadata ────────────────────────────────────────────────────────────
platform: splunk
rule_type: SavedSearch
use_case_id: Network-DET-Cisco-004_cisco_sdwan_admin_password_rapid_change
index: "*-network"
sourcetype: syslog
schedule: "*/20 * * * *"
lookback: 20m
suppress: host:2h

prerequisites:
    - Cisco Catalyst SD-WAN Manager syslog (/var/log/auth.log) forwarded to Splunk
    - index="*-network" sourcetype=syslog receiving vManage auth.log/usermod events
    - Note: promote to CorrelationSearch after validating FP rate in production over 2 weeks

lookups:
    - high_value_assets.csv

falsepositives:
    - Legitimate planned password rotation by two administrators executing changes
      in rapid succession — review change ticket correlation
    - Automated credential rotation scripts that change and verify — mitigate by
      adding automation account names to a dedicated lookup if applicable
    - Cisco TAC-directed password reset with immediate re-rotation — document the
      window and suppress time-based

# medium: rapid change+revert pattern is suspicious but has plausible legitimate explanations;
# promote to high after production FP baseline validation
level: medium

validation:
    status: NO-DATA
    reason: source-silent — lab is Windows endpoint only; no SD-WAN Manager auth.log in Splunk;
            Splunk credentials not configured for this session.
    prod_query: |
        index="*-network" sourcetype=syslog usermod "change user" admin password
        earliest=-24h | head 10

tests:
    - name: Two rapid password changes on admin (change + revert pattern)
      log_source:
          product: linux
          service: auth
      event:
          _raw: |
              Jan 01 08:00:00 vManage usermod[12345]: change user 'admin' password
              Jan 01 08:15:00 vManage usermod[12345]: change user 'admin' password
          host: vManage
          sourcetype: syslog
      expected: match

    - name: Single password change (no revert — should not trigger threshold)
      log_source:
          product: linux
          service: auth
      event:
          _raw: "Jan 01 09:00:00 vManage usermod[40000]: change user 'admin' password"
          host: vManage
          sourcetype: syslog
      expected: no_match

spl_query: |
    `comment("── Hunt: two or more admin password changes within 20 minutes ──────────")`
    index="*-network" sourcetype=syslog
        earliest=-20m latest=now
        usermod "change user" admin password
    `comment("── Extract host and timestamp ─────────────────────────────────────────")`
    | rex field=_raw
        "^(?:[A-Z][a-z]{2}\s+\d+\s+[\d:]+)\s+(?P<sdwan_host>\S+)\s+usermod"
    `comment("── Count password changes per SD-WAN device ───────────────────────────")`
    | stats
        min(_time)      AS first_change
        max(_time)      AS last_change
        count           AS change_count
        values(_raw)    AS raw_events
        latest(sdwan_host) AS sdwan_host
        by host
    `comment("── Threshold: 2 or more changes in window = suspicious ────────────────")`
    | where change_count >= 2
    `comment("── Severity graduation ─────────────────────────────────────────────────")`
    | lookup high_value_assets.csv hostname AS sdwan_host
        OUTPUT criticality AS asset_criticality
    | eval severity = if(asset_criticality="critical", "high", "medium")
    `comment("── Rule metadata ──────────────────────────────────────────────────────")`
    | eval
        time_span_min    = round((last_change - first_change) / 60, 1),
        attck_technique  = "T1098",
        rule_id          = "Network-DET-Cisco-004_cisco_sdwan_admin_password_rapid_change",
        triage           = "1. Verify whether this change was authorized (check change ticket / maintenance window). 2. Review /var/confd/rollback/ for config delta commits targeting user passwords. 3. Correlate with SSH auth log entries for same time window from external IPs (rule 002). 4. Check SD-WAN Manager web access logs for authentication events between the two password changes. 5. If no change ticket exists: treat as active intrusion and invoke IR."
    | table
        severity, host, sdwan_host, change_count, time_span_min,
        first_change, last_change,
        asset_criticality, attck_technique, rule_id, triage
    | sort - severity, - change_count
