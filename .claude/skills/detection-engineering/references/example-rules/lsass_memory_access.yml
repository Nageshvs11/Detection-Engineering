# REFERENCE EXAMPLE — all five detection engineering standards satisfied.
# Use this as a template when writing new rules.
#
# Standards checklist:
# [x] 1. attack.tXXXX tag present (not tactic-only)
# [x] 2. level is low/medium/high/critical with inline justification comment
# [x] 3. falsepositives lists concrete scenarios (not just "Unknown")
# [x] 4. At least one positive + one negative test case
# [x] 5. Filename is lowercase_with_underscores.yml

title: LSASS Memory Access by Suspicious Process
id: 5ef4a8ab-b788-4b3e-990e-b88a72cd82b1
status: experimental
description: >
    Detects processes opening LSASS with access rights used by credential
    dumping tools (Mimikatz, ProcDump, Task Manager). Filters known-legitimate
    callers (Windows Defender, WerFault) to reduce noise. Complement with
    proc_access_win_lsass_minidump_api for CallTrace-based coverage.
references:
    - https://attack.mitre.org/techniques/T1003/001/
    - https://docs.microsoft.com/en-us/windows/win32/procthread/process-security-and-access-rights
author: Detection KB
date: 2024-01-15
modified: 2024-06-01

# STANDARD 1 — ATT&CK technique tag (attack.tXXXX required, tactic alone is not enough)
tags:
    - attack.credential-access      # tactic
    - attack.t1003.001              # technique: OS Credential Dumping: LSASS Memory

logsource:
    category: process_access        # Sysmon Event ID 10
    product: windows

detection:
    selection:
        TargetImage|endswith: '\lsass.exe'
        GrantedAccess|contains:
            - '0x1010'   # PROCESS_QUERY_LIMITED_INFORMATION | PROCESS_VM_READ
            - '0x1410'   # + PROCESS_QUERY_INFORMATION
            - '0x143a'   # seen in common dumping tools
            - '0x1438'   # seen in common dumping tools
            - '0x1FFFFF' # PROCESS_ALL_ACCESS
    filter_legitimate:
        SourceImage|startswith:
            - 'C:\Windows\System32\'
            - 'C:\Windows\SysWOW64\'
            - 'C:\Program Files\Windows Defender\'
        SourceImage|endswith:
            - '\MsMpEng.exe'
            - '\SenseIR.exe'
            - '\WerFault.exe'
            - '\taskmgr.exe'
    condition: selection and not filter_legitimate

# STANDARD 2 — level with inline justification comment directly above the field
# high: GrantedAccess masks targeting LSASS cover the minimum rights needed to dump
# credentials; no production software outside security tooling and WER uses these.
# FP rate is low after filtering, making high appropriate over medium.
level: high

# STANDARD 3 — concrete false positive scenarios, not just "Unknown"
falsepositives:
    - Windows Error Reporting (WerFault.exe) collecting LSASS crash diagnostics
      — filtered; only fires if WerFault is renamed or run from an unexpected path
    - EDR and AV engines (Defender MsMpEng.exe, SenseIR.exe) performing memory
      inspection — filtered; add vendor binaries to filter_legitimate as needed
    - Authorized incident-response use of SysInternals ProcDump or Task Manager
      — distinguish by SourceImage path, user context, and change-ticket existence
    - Third-party monitoring agents that embed crash-dump libraries (rare)
      — verify SourceImage and vendor before suppressing

# STANDARD 4 — test cases: at least one positive; one negative per filter block
tests:
    - name: Mimikatz sekurlsa::logonpasswords opens LSASS with full access rights
      log_source:
          product: windows
          category: process_access
      event:
          TargetImage: 'C:\Windows\System32\lsass.exe'
          SourceImage: 'C:\Users\attacker\mimikatz.exe'
          GrantedAccess: '0x1010'
      expected: match

    - name: ProcDump -ma targeting LSASS with PROCESS_ALL_ACCESS
      log_source:
          product: windows
          category: process_access
      event:
          TargetImage: 'C:\Windows\System32\lsass.exe'
          SourceImage: 'C:\Windows\Temp\procdump.exe'
          GrantedAccess: '0x1FFFFF'
      expected: match

    # Negative test — confirms filter_legitimate suppresses WerFault correctly
    - name: WerFault collecting LSASS crash diagnostic (filtered, should not alert)
      log_source:
          product: windows
          category: process_access
      event:
          TargetImage: 'C:\Windows\System32\lsass.exe'
          SourceImage: 'C:\Windows\System32\WerFault.exe'
          GrantedAccess: '0x1410'
      expected: no_match
